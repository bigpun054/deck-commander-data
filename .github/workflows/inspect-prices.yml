name: Inspect EDHREC price fields
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 inspect_prices.py
      - name: Commit report
        run: |
          git config user.name "commander-bot"
          git config user.email "commander-bot@users.noreply.github.com"
          git add samples/price-report.json
          git diff --cached --quiet || git commit -m "EDHREC price field report"
          git push
