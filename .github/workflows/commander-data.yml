name: Fetch commander suggestions
on:
  schedule:
    - cron: "17 10 * * 1"   # weekly, Mondays
  workflow_dispatch:
    inputs:
      limit:
        description: "How many top commanders to fetch"
        default: "10"
permissions:
  contents: write
concurrency:
  group: commander-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch commanders from EDHREC
        run: python3 fetch_commanders.py --out out --limit "${{ github.event.inputs.limit || '10' }}" --period year
      - name: Commit results
        run: |
          rm -rf commanders index.json
          mv out/commanders commanders
          mv out/index.json index.json
          git config user.name "commander-bot"
          git config user.email "commander-bot@users.noreply.github.com"
          git add -A commanders index.json
          git diff --cached --quiet || git commit -m "Commanders $(date -u +%F)"
          git push
